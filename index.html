<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>LGS Asistan</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b2030;--mu:#667085;--ac:#3b5bdb;--ok:#2f9e44;--bad:#e03131;--bd:#e3e6ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1b1f2b;--tx:#e8eaf2;--mu:#9aa2b8;--ac:#7c93ff;--ok:#51cf66;--bad:#ff6b6b;--bd:#2c3242;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1b1f2b;--tx:#e8eaf2;--mu:#9aa2b8;--ac:#7c93ff;--ok:#51cf66;--bad:#ff6b6b;--bd:#2c3242;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.w{max-width:960px;margin:0 auto;padding:14px}h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 8px}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.on,button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}nav{display:flex;gap:6px;overflow-x:auto;padding:10px 0}nav button{white-space:nowrap}
.m{color:var(--mu);font-size:13px}.ex{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:5px 6px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}
.bad{color:var(--bad)}.ok{color:var(--ok)}.ai{white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:8px}
.login{max-width:340px;margin:8vh auto}.login input{width:100%;box-sizing:border-box;margin:5px 0}
@media print{nav,.top,.noprint,#bnr{display:none!important}body{background:#fff}.c{break-inside:avoid}}
</style></head><body><div class="w" id="app"><div class="m">Yükleniyor…</div></div>
<script>
const SUB=[["Türkçe",20,4],["Matematik",20,4],["Fen Bilimleri",20,4],["İnkılap / Sosyal",10,1],["Din Kültürü",10,1],["İngilizce",10,1]];
const OFF=[0,20,40,60,70,80];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f1=x=>(Math.round(x*10)/10).toString().replace(".",",");
let db,sample,assets,me=null,tab=0,D={acc:[],ex:[],res:[],rs:[],msg:[],ap:[],sch:[],nt:[],an:[],pg:[]},subj="",chat=[],tmp={};
try{me=JSON.parse(sessionStorage.getItem("me"))}catch(e){}
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
let TOKEN="";try{TOKEN=sessionStorage.getItem("tok")||""}catch(e){}
async function api(path,opt={}){const h={...(TOKEN?{Authorization:"Bearer "+TOKEN}:{}),...(typeof opt.body=="string"?{"Content-Type":"application/json"}:{})};const r=await fetch("/api"+path,{...opt,headers:h});const j=await r.json().catch(()=>({}));if(r.status==401&&TOKEN&&path!="/login"){logout();throw new Error("Oturum süresi doldu, tekrar giriş yap.")}if(!r.ok)throw new Error(j.error||("Hata "+r.status));return j}
const subs={},last={};let pollT=null;
async function pollAll(){for(const c of Object.keys(subs)){try{const rows=await api("/c/"+c),h=JSON.stringify(rows);if(last[c]===h)continue;last[c]=h;subs[c].forEach(cb=>cb({docs:rows.map(({id,...d})=>({id,data:()=>d}))}))}catch(e){}}}
function startPoll(){stopPoll();pollAll();pollT=setInterval(pollAll,5000)}
function stopPoll(){clearInterval(pollT);pollT=null;for(const k in last)delete last[k]}
const apiDb={collection:c=>({onSnapshot(cb){(subs[c]=subs[c]||[]).push(cb);return()=>{}},async add(d){const r=await api("/c/"+c,{method:"POST",body:JSON.stringify(d)});pollAll();return{id:r.id}}}),doc:p=>{const[c,id]=p.split("/");return{async set(d){await api("/d/"+c+"/"+id,{method:"PUT",body:JSON.stringify(d)});pollAll()},async update(d){await api("/d/"+c+"/"+id,{method:"PATCH",body:JSON.stringify(d)});pollAll()},async delete(){await api("/d/"+c+"/"+id,{method:"DELETE"});pollAll()}}}};
const toB64=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r({type:f.type||"image/jpeg",data:fr.result.split(",")[1]});fr.readAsDataURL(f)});
const apiSample=async(input,o={})=>{const images=await Promise.all((o.images||[]).map(toB64));const r=await api("/ai",{method:"POST",body:JSON.stringify({input,images})});if(o.onText)o.onText({text:r.text,delta:r.text});return r};
const apiAssets={async upload(f){const r=await fetch("/api/upload",{method:"POST",headers:{Authorization:"Bearer "+TOKEN,"X-Filename":encodeURIComponent(f.name),"Content-Type":f.type||"application/octet-stream"},body:f}),j=await r.json();if(!r.ok)throw new Error(j.error);return j}};
const fileUrl=id=>"/api/file/"+id+"?t="+encodeURIComponent(TOKEN);
function localDl(){return{save:async o=>{const a=document.createElement("a");a.href=URL.createObjectURL(o.data);a.download=o.filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}}}
async function init(){window.addEventListener("error",ev=>{const a=document.getElementById("app");if(a&&/Yükleniyor/.test(a.textContent))a.innerHTML='<div class="c"><b>Başlatma hatası:</b> '+esc(ev.message)+'</div>'});
 window.addEventListener("unhandledrejection",ev=>{ev.preventDefault();alert("İşlem başarısız: "+((ev.reason&&ev.reason.message)||ev.reason))});
 db=apiDb;sample=apiSample;assets=apiAssets;me=null;
 for(const [k,c] of [["acc","accounts"],["ex","exams"],["res","results"],["rs","resources"],["msg","msgs"],["ap","appts"],["sch","schools"],["nt","notes"],["an","ann"],["pg","programs"]])db.collection(c).onSnapshot(s=>{D[k]=s.docs.map(d=>({...d.data(),_id:d.id}));if(!tmp.busy&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||""))R()});
 try{if(TOKEN){me=(await api("/me")).user;startPoll()}else tmp.setup=(await api("/status")).setup}catch(e){TOKEN="";try{tmp.setup=(await api("/status")).setup}catch(e2){app.innerHTML='<div class="c">Sunucuya bağlanılamadı.</div>';return}}
 R()}
const net=r=>r[0]-r[1]/3,tot=r=>r.reduce((a,x)=>a+net(x),0);
function sc(r){let w=0;r.forEach((x,i)=>w+=net(x)*SUB[i][2]);return Math.round(100+400*Math.max(0,w)/270)}
function calc(key,ans){const r=SUB.map(()=>[0,0,0]),wr=[];for(let i=0;i<90;i++){const s=OFF.filter(o=>o<=i).length-1,k=key[i];if(!k||k=="-")continue;const a=ans[i]||"-";if(a=="-")r[s][2]++;else if(a==k)r[s][0]++;else{r[s][1]++;wr.push(i+1)}}return{r,wr}}
function R(){if(!me)return login();const rol=me.role;const T=rol=="ogrenci"?["📊 Sonuçlarım","🤖 Rehberlik","💬 Randevu & Mesaj","🗓 Program","📚 Kaynaklar"]:rol=="veli"?["📊 Sonuçlar","💬 Randevu & Mesaj","🗓 Program","📚 Kaynaklar"]:["📝 Denemeler","📷 Optik Okuma","💬 Randevu & Mesaj","🗓 Program","📚 Kaynaklar","👥 Öğrenciler","📈 Raporlar","🏫 Okullar",...(rol=="rehber"?["🔑 Kullanıcılar"]:[])];
 if(tab>=T.length)tab=0;
 app.innerHTML=`<div class="row" style="justify-content:space-between"><h1>🎯 LGS Asistan</h1><div class="row"><span class="m">${esc(me.name)} · ${rol=="ogrenci"?"Öğrenci":rol=="veli"?"Veli":rol=="rehber"?"Rehber öğretmen":"Branş öğretmeni"+(me.branch?" ("+esc(me.branch)+")":"")}</span><button onclick="logout()">Çıkış</button></div></div>${banner()}<nav>${T.map((t,i)=>`<button class="${tab==i?"on":""}" onclick="tab=${i};R()">${t}</button>`).join("")}</nav><div id="v"></div>`;
 const V=rol=="ogrenci"?[sonuc,rehber,mesaj,program,kaynak]:rol=="veli"?[sonuc,mesaj,program,kaynak]:[denemeler,optik2,mesaj,program,kaynak,ogrList,raporlar,okullar,kullanici];v.innerHTML=V[tab]()}
function login(){app.innerHTML=`<div class="login c"><h1>🎯 LGS Asistan</h1><p class="m">${tmp.setup?"İlk kurulum: rehber öğretmen hesabı oluştur.":"TC kimlik no ve şifrenle giriş yap."}</p>${tmp.setup?'<input id="ln" placeholder="Ad Soyad">':""}<input id="lt" inputmode="numeric" maxlength="11" placeholder="TC kimlik no"><input id="lp" type="password" placeholder="Şifre" onkeydown="if(event.key==\'Enter\')doLogin()"><button class="p" style="width:100%" onclick="doLogin()">${tmp.setup?"Hesabı oluştur":"Giriş"}</button><p class="m" id="le"></p></div>`}
async function doLogin(){const tc=lt.value.trim(),p=lp.value;if(!/^\d{11}$/.test(tc)||p.length<6)return le.textContent="TC 11 haneli, şifre en az 6 karakter olmalı.";le.textContent="";try{const r=await api(tmp.setup?"/setup":"/login",{method:"POST",body:JSON.stringify({tc,password:p,name:tmp.setup?ln.value:undefined})});TOKEN=r.token;try{sessionStorage.setItem("tok",TOKEN)}catch(e){}me=r.user;tmp.setup=0;tab=0;startPoll();R()}catch(e){le.textContent=e.message}}
function exStats(e){const rs=D.res.filter(r=>r.exam==e._id);return{n:rs.length,avg:SUB.map((_,i)=>rs.length?rs.reduce((a,r)=>a+net(r.r[i]),0)/rs.length:0)}}
function denemeler(){const subs=SUB.map((s,i)=>[s[0],i]);return`<div class="c"><h2>Yeni deneme</h2><div class="row"><input id="xn" placeholder="Deneme adı (ör. MEB 1. Dönem)"><input id="xd" type="date"></div><div class="row" style="margin-top:6px"><select id="xg" onchange="setG(this.value)"><option value="8">8. sınıf</option><option value="7">7. sınıf</option><option value="6">6. sınıf</option><option value="5">5. sınıf</option></select>${SUB.map((s,i)=>`<label class="m">${esc(s[0].split(" ")[0])} <input id="xc${i}" type="number" min="0" max="40" value="${s[1]}" style="width:56px"></label>`).join("")}</div>
 <p class="m">Sınıfı ve ders başına soru sayısını seç. Cevap anahtarını sırayla ders ders, soru sayısı kadar harf (A/B/C/D) olarak yaz. İptal soru için “-” yaz. Ön tanımlı soru sayıları örnektir, kendi sınavına göre düzenle.</p><textarea id="xk" rows="2" style="width:100%;box-sizing:border-box" placeholder="ABCD..."></textarea><p class="m">İsteğe bağlı: her sorunun konusu (her soru için bir konu; satır veya noktalı virgülle ayır). Kazanım analizi için gerekli.</p><textarea id="xt" rows="2" style="width:100%;box-sizing:border-box" placeholder="Sözcükte anlam; Paragraf; ..."></textarea><p><button class="p" onclick="addEx()">Denemeyi kaydet</button></p></div>
 <div class="c"><div class="row"><h2 style="margin:0">Denemeler ve sınıf ortalamaları</h2><select onchange="subj=this.value;R()"><option value="">Tüm dersler</option>${subs.map(s=>`<option value="${s[1]}" ${subj==s[1]&&subj!==""?"selected":""}>${s[0]}</option>`).join("")}</select></div><div class="ex"><table><tr><th>Deneme</th><th>Katılım</th>${SUB.map((s,i)=>subj===""||subj==i?`<th>${s[0].split(" ")[0]}</th>`:"").join("")}<th></th></tr>${D.ex.sort((a,b)=>(b.date||"")<(a.date||"")?-1:1).map(e=>{const s=exStats(e);return`<tr><td>${esc(e.name)}<div class="m">${esc(e.date||"")}</div></td><td>${s.n}</td>${s.avg.map((x,i)=>subj===""||subj==i?`<td>${s.n?f1(x):"—"}</td>`:"").join("")}<td><button onclick="delEx('${e._id}')">🗑</button></td></tr>`}).join("")||'<tr><td class="m">Deneme yok</td></tr>'}</table></div></div>`}
async function addEx(){const k=xk.value.toUpperCase().replace(/[^ABCD\-]/g,"");if(!xn.value||k.length!=90)return alert("Ad gir ve 90 karakterlik anahtar yaz (şu an "+k.length+").");const tp=xt.value.split(/[\n;]+/).map(x=>x.trim()).filter(Boolean);if(tp.length&&tp.length!=90)return alert("Konu listesi 90 öğe olmalı (şu an "+tp.length+"). Boş da bırakabilirsin.");await db.collection("exams").add({name:xn.value,date:xd.value,key:k,topics:tp,by:me.tc});R()}
async function delEx(id){if(confirm("Deneme ve sonuçları silinsin mi?")){for(const r of D.res.filter(r=>r.exam==id))await db.doc("results/"+r._id).delete();await db.doc("exams/"+id).delete()}}
function optik(){const st=D.acc.filter(a=>a.role=="ogrenci");return`<div class="c"><h2>Optik form okuma</h2><div class="row"><select id="oe">${D.ex.map(e=>`<option value="${e._id}">${esc(e.name)}</option>`).join("")}</select><select id="os">${st.map(a=>`<option value="${a.tc}">${esc(a.name)} ${esc(a.cls||"")}</option>`).join("")}</select></div>
 <p><input type="file" id="of" accept="image/*" capture="environment"> <button class="p" onclick="readForm()">Fotoğraftan oku</button></p><p class="m">Yapay zeka formdaki işaretleri okur. Okunan cevapları mutlaka kontrol edip düzelt, sonra kaydet. Cevaplar “-” boş, “X” birden fazla işaret demektir.</p>
 <textarea id="oa" rows="3" style="width:100%;box-sizing:border-box" placeholder="Cevap dizisi (elle de girilebilir)"></textarea><p><button class="p" onclick="saveRes()">Sonucu kaydet ve analiz et</button> <span id="om" class="m"></span></p></div>`}
async function readForm(){const f=of.files[0];if(!f)return alert("Fotoğraf seç.");if(!sample)return alert("Yapay zeka erişimi yok.");om.textContent="Okunuyor…";tmp.busy=1;tmp.img=f;
 try{const r=await sample("Bu bir LGS optik cevap formu fotoğrafı (90 soru: Türkçe 1-20, Matematik 21-40, Fen 41-60, İnkılap 61-70, Din 71-80, İngilizce 81-90). Her soru için işaretlenen şıkkı A, B, C veya D olarak oku. Boşsa '-', birden fazla işaret varsa 'X' yaz. Yalnızca 90 karakterlik tek bir dize döndür, başka hiçbir şey yazma.",{images:[f],cache:false});oa.value=r.text.toUpperCase().replace(/[^ABCDX\-]/g,"").slice(0,90);om.textContent=oa.value.length+" karakter okundu. Kontrol et."}catch(e){om.textContent="Okuma başarısız: "+(e.message||e.code)}tmp.busy=0}
async function saveRes(){const a=oa.value.toUpperCase().replace(/[^ABCDX\-]/g,""),ex=D.ex.find(e=>e._id==oe.value);if(!ex||!os.value||a.length!=NQ(ex))return alert("Deneme, öğrenci seç ve 90 karakter gir (şu an "+a.length+").");
 const{r,wr}=calc(ex,a);let img="";try{if(assets&&tmp.img)img=(await assets.upload(tmp.img)).id}catch(e){}
 await db.doc("results/"+ex._id+"_"+os.value).set({exam:ex._id,tc:os.value,ans:a,r,wr,img,date:new Date().toISOString()});tmp.img=null;om.innerHTML="Kaydedildi: "+f1(tot(r))+" net, tahmini puan "+sc(r)+' <button onclick="pdfRes(\''+ex._id+"_"+os.value+'\')">📄 PDF</button>'}
function sonuc(){const mine=D.res.filter(r=>r.tc==OT()).map(r=>({...r,e:D.ex.find(e=>e._id==r.exam)})).filter(r=>r.e).sort((a,b)=>(a.e.date||"")<(b.e.date||"")?-1:1);
 const avg=SUB.map((_,i)=>mine.length?mine.reduce((a,r)=>a+net(r.r[i]),0)/mine.length:0);
 return`<div class="c"><h2>Deneme sonuçlarım</h2><div class="ex"><table><tr><th>Deneme</th>${SUB.map(s=>`<th>${s[0].split(" ")[0]}</th>`).join("")}<th>Toplam</th><th>Puan</th><th>Sınıf ort.</th><th>PDF</th></tr>${mine.map(r=>{const s=exStats(r.e);return`<tr><td>${esc(r.e.name)}</td>${r.r.map(x=>`<td>${f1(net(x))}</td>`).join("")}<td><b>${f1(tot(r.r))}</b></td><td>${sc(r.r)}</td><td>${f1(s.avg.reduce((a,b)=>a+b,0))}</td><td><button onclick="pdfRes('${r._id}')">📄</button></td></tr>`}).join("")||'<tr><td class="m">Henüz sonuç yok</td></tr>'}${mine.length?`<tr><td><b>Ortalama</b></td>${avg.map(x=>`<td><b>${f1(x)}</b></td>`).join("")}<td><b>${f1(avg.reduce((a,b)=>a+b,0))}</b></td><td></td><td></td><td></td></tr>`:""}</table></div></div>
 ${mine.length?`<div class="c"><h2>Analiz ve öneriler</h2>${localAn(mine[mine.length-1])}<p><button class="p" onclick="aiAn()">🤖 Yapay zeka ile geniş analiz</button></p><div id="aio" class="ai" style="display:none"></div></div>${kazanim(OT())}${simul(mine)}${me.role=="veli"?`<div class="c"><h2>Haftalık veli özeti</h2><p><button class="p" onclick="veliOz()">Özet oluştur</button></p><div id="vo" class="ai" style="display:none"></div></div>`:""}`:""}`}
function localAn(r){const s=exStats(r.e);const L=SUB.map((x,i)=>{const n=net(r.r[i]),p=n/x[1],cl=s.avg[i];return{n:x[0],p,d:n-cl,y:r.r[i][1],b:r.r[i][2]}}).sort((a,b)=>a.p-b.p);
 return`<p>Son deneme: <b>${esc(r.e.name)}</b></p>`+L.slice(0,3).map(x=>`<p>• <b>${x.n}</b>: başarı %${Math.round(Math.max(0,x.p)*100)}, sınıf ortalamasına göre ${x.d>=0?"+":""}${f1(x.d)} net. ${x.y>x.b?"Yanlışların fazla: acele etme, şıkları eleyerek çöz.":"Boşların fazla: konu eksiklerini tamamla."} Bu derste yanlış yaptığın soruların konularını tekrar et.</p>`).join("")}
async function aiAn(){const mine=D.res.filter(r=>r.tc==OT()).map(r=>({...r,e:D.ex.find(e=>e._id==r.exam)})).filter(r=>r.e);const o=document.getElementById("aio");o.style.display="block";o.textContent="Analiz hazırlanıyor…";
 const data=mine.map(r=>({deneme:r.e.name,netler:Object.fromEntries(SUB.map((s,i)=>[s[0],{dogru:r.r[i][0],yanlis:r.r[i][1],bos:r.r[i][2]}])),yanlis_sorular:r.wr,sinif_ort_net:exStats(r.e).avg.map(f1)}));
 try{await sample("Sen deneyimli bir LGS rehber öğretmenisin. Aşağıdaki deneme verilerine göre 8. sınıf öğrencisine Türkçe, samimi ve kısa bir analiz yaz: güçlü/zayıf dersler, gelişim trendi, yanlış sorulardan çıkan konu önerileri, boş/yanlış dengesi, bu hafta için 5 maddelik çalışma planı. Veri: "+JSON.stringify(data),{cache:false,onText:u=>o.textContent=u.text})}catch(e){o.textContent="Analiz üretilemedi: "+(e.message||e.code)}}
function rehber(){return`<div class="c"><h2>🤖 Yapay zeka rehber öğretmen</h2><div id="ch">${chatH()}</div><div class="row" style="margin-top:8px"><input id="cm" style="flex:1;min-width:0" placeholder="Sorunu yaz (motivasyon, planlama, ders çalışma…)" onkeydown="if(event.key=='Enter')send()"><button class="p" onclick="send()">Gönder</button></div><p class="m">Ciddi sıkıntılarda mutlaka okul rehber öğretmenine veya bir yetişkine ulaş.</p></div>`}
const chatH=()=>chat.map(m=>`<p class="${m.role=="user"?"m":"ai"}"><b>${m.role=="user"?"Sen":"Rehber"}:</b> ${esc(m.content)}</p>`).join("")||'<p class="m">Merhaba! Sınav kaygısı, çalışma planı veya deneme sonuçların hakkında konuşabiliriz.</p>';
async function send(){const t=cm.value.trim();if(!t||!sample)return;cm.value="";chat.push({role:"user",content:t});chat.push({role:"assistant",content:"…"});ch.innerHTML=chatH();const mine=D.res.filter(r=>r.tc==me.tc).map(r=>({d:(D.ex.find(e=>e._id==r.exam)||{}).name,net:f1(tot(r.r))}));

 try{const r=await sample("Sen deneyimli bir LGS koçusun. Öğrencinin haftalık çalışma programını değerlendir (Türkçe, samimi, 4-5 madde): yük dengeli mi, dinlenme yeterli mi, zayıf konulara yer var mı, neyi değiştirmeli. Program: "+JSON.stringify(p.days.map(d=>({gun:d.day,gorevler:d.tasks.map(t=>t.text+(t.q>0?" ("+t.q+" soru)":""))})))+" Zayıf konular: "+JSON.stringify(w),{cache:false});o.textContent=r.text}catch(e){o.textContent="Yorum üretilemedi: "+e.message}}
function program(){const can=me.role!="veli",stf=me.role=="rehber"||me.role=="brans",tc=ptc(),mine=D.pg.filter(p=>p.tc==tc).sort((a,b)=>a.created<b.created?1:-1),sel=D.pg.find(p=>p._id==tmp.pid&&p.tc==tc)||mine[0];
 return(stf?`<div class="c noprint"><label class="m">Öğrenci </label><select onchange="tmp.stu=this.value;tmp.pid=null;if(PG)PG.stu=this.value;R()">${D.acc.filter(a=>a.role=="ogrenci").map(a=>`<option value="${a.tc}" ${a.tc==tc?"selected":""}>${esc(a.name)} ${esc(a.cls||"")}</option>`).join("")}</select></div>`:"")
 +(can?`<div class="c noprint"><div class="row"><h2 style="margin:0">🤖 Çalışma programı robotu</h2><button class="p" onclick="PG=newPG();R()">+ Yeni program hazırla</button></div><p class="m">Bilgilerini ve çalışmak istediğin konuları seç, robot sana haftalık programı hazırlasın. Program sisteme kaydedilir.</p></div>`:"")
 +(PG&&can?wizard():"")
 +(mine.length>1?`<div class="c noprint"><h2>Kayıtlı programlar</h2><div class="row">${mine.map(p=>`<button class="${sel&&p._id==sel._id?"on":""}" onclick="tmp.pid='${p._id}';R()">${(p.created||"").slice(0,10)} · ${esc(p.title)}</button>`).join("")}</div></div>`:"")
 +(sel?progView(sel,can):`<div class="c m">${me.role=="veli"?"Öğrencinin kayıtlı programı yok.":"Henüz program yok. “Yeni program hazırla” ile başla."}</div>`)}
function logout(){TOKEN="";try{sessionStorage.removeItem("tok")}catch(e){}stopPoll();me=null;tab=0;chat=[];tmp={};try{sessionStorage.removeItem("me")}catch(e){}R()}
init();
</script></body></html>
